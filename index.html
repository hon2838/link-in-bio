<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathew Hon - Links</title>
    <meta name="description" content="Tech enthusiast, content creator, and gamer based in Malaysia. Connect with me on socials.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    
    <!-- Side Navigation Directory -->
    <nav class="side-nav">
        <a href="#profile" class="nav-dot active" title="Profile"></a>
        <a href="#linkedin" class="nav-dot" title="LinkedIn"></a>
        <a href="#github" class="nav-dot" title="GitHub"></a>
        <a href="#facebook" class="nav-dot" title="Facebook"></a>
        <a href="#instagram" class="nav-dot" title="Instagram"></a>
    </nav>
    
    <div class="scroll-container">
        <!-- Profile Section -->
        <section id="profile" class="screen profile-screen">
            <div class="avatar-container">
                <img src="profile.jpg?v=2" alt="Mathew Hon at Galata Bridge" title="Sunny afternoon in September at Galata Bridge" class="avatar" id="profile-img">
            </div>
            <h1 class="name">Mathew Hon</h1>
            <p class="bio">Tech & Hardware Enthusiast • Content Creator • Gamer<br>Based in Malaysia 🇲🇾</p>
            
            <div class="time-badge">
                <span class="pulse-dot"></span>
                <span id="local-time">Loading time...</span>
            </div>
            
            <div class="scroll-indicator">
                <span>Scroll to Explore</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
        </section>

        <!-- Links -->
        <section id="linkedin" class="screen link-screen">
            <a href="https://www.linkedin.com/in/hon2838/" class="giant-link linkedin" target="_blank" rel="noopener noreferrer">
                <span class="giant-text" data-text="LINKEDIN">LINKEDIN</span>
            </a>
        </section>

        <section id="github" class="screen link-screen">
            <a href="https://github.com/hon2838" class="giant-link github" target="_blank" rel="noopener noreferrer">
                <span class="giant-text" data-text="GITHUB">GITHUB</span>
            </a>
        </section>

        <section id="facebook" class="screen link-screen">
            <a href="https://www.facebook.com/mathewhon2838" class="giant-link facebook" target="_blank" rel="noopener noreferrer">
                <span class="giant-text" data-text="FACEBOOK">FACEBOOK</span>
            </a>
        </section>

        <section id="instagram" class="screen link-screen">
            <a href="https://www.instagram.com/hon2838/" class="giant-link instagram" target="_blank" rel="noopener noreferrer">
                <span class="giant-text" data-text="INSTAGRAM">INSTAGRAM</span>
            </a>
        </section>
        
        <section class="screen footer-screen">
            <footer>
                &copy; 2026 Mathew Hon 
                <span class="footer-separator">|</span> 
                <a href="https://github.com/hon2838/link-in-bio" target="_blank" rel="noopener noreferrer" class="footer-repo-link">View Source Code</a>
            </footer>
        </section>
    </div>

    <script>
        // Update Time & Night Mode
        function updateTime() {
            const options = { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const timeString = new Date().toLocaleTimeString('en-US', options);
            document.getElementById('local-time').textContent = timeString + ' (MYT)';
            
            // Gradual time themes
            const hour = parseInt(new Date().toLocaleString('en-US', {timeZone: 'Asia/Kuala_Lumpur', hour: 'numeric', hour12: false}));
            
            // Remove previous themes
            document.body.classList.remove('theme-morning', 'theme-day', 'theme-sunset', 'theme-night');
            
            // Apply current theme
            if (hour >= 6 && hour < 10) {
                document.body.classList.add('theme-morning');
            } else if (hour >= 10 && hour < 17) {
                document.body.classList.add('theme-day');
            } else if (hour >= 17 && hour < 20) {
                document.body.classList.add('theme-sunset');
            } else {
                document.body.classList.add('theme-night');
            }
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Navigation Directory Logic
        const sections = document.querySelectorAll('.screen');
        const navDots = document.querySelectorAll('.nav-dot');

        const observerOptions = {
            root: document.querySelector('.scroll-container'),
            threshold: 0.5
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.getAttribute('id');
                    if (id) {
                        navDots.forEach(dot => {
                            dot.classList.remove('active');
                            if (dot.getAttribute('href') === '#' + id) {
                                dot.classList.add('active');
                            }
                        });
                    }
                }
            });
        }, observerOptions);

        sections.forEach(sec => observer.observe(sec));
    </script>
</body>
</html>
